name: Stack Sync

on:
  push:
    branches:
      - chore/standardize-stack
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stack-sync-ai-news
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: chore/standardize-stack

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Activate Tailwind 4 and normalize initial React state
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = Path('src/style.css')
          css_text = css.read_text()
          tailwind_import = "@import 'tailwindcss';"
          if tailwind_import not in css_text:
              css.write_text(tailwind_import + "\n\n" + css_text)
          elif css_text.count(tailwind_import) != 1:
              raise SystemExit(f'Expected at most one Tailwind import, found {css_text.count(tailwind_import)}')

          app = Path('src/App.tsx')
          app_text = app.read_text()

          replacements = [
              (
                  'export default function App() {\n',
                  'export default function App() {\n  const [initialPrefs] = useState(() => loadPrefs());\n',
                  'const [initialPrefs] = useState(() => loadPrefs());',
              ),
              (
                  '  const [activeSources, setActiveSources] = useState<string[]>(SOURCES.map((source) => source.id));',
                  "  const [activeSources, setActiveSources] = useState<string[]>(() => {\n    if (!initialPrefs) return [];\n    const validIds = new Set(SOURCES.map((source) => source.id));\n    return initialPrefs.sources.filter((source) => validIds.has(source));\n  });",
                  'return initialPrefs.sources.filter((source) => validIds.has(source));',
              ),
              (
                  '  const [setupOpen, setSetupOpen] = useState(false);',
                  '  const [setupOpen, setSetupOpen] = useState(() => !initialPrefs);',
                  'const [setupOpen, setSetupOpen] = useState(() => !initialPrefs);',
              ),
              (
                  '  const [setupPrefs, setSetupPrefs] = useState<Preferences | null>(null);',
                  '  const [setupPrefs, setSetupPrefs] = useState<Preferences | null>(() => initialPrefs);',
                  'const [setupPrefs, setSetupPrefs] = useState<Preferences | null>(() => initialPrefs);',
              ),
              (
                  'className="app-shell"',
                  'className="app-shell min-h-screen"',
                  'className="app-shell min-h-screen"',
              ),
          ]

          for old, new, marker in replacements:
              if marker not in app_text:
                  if app_text.count(old) != 1:
                      raise SystemExit(f'Expected exactly one occurrence for migration marker: {old!r}; found {app_text.count(old)}')
                  app_text = app_text.replace(old, new, 1)

          if 'const timer = window.setTimeout' not in app_text:
              pattern = re.compile(
                  r"  useEffect\(\(\) => \{\n"
                  r"    if \(didInitialize\.current\) return;\n"
                  r"    didInitialize\.current = true;\n"
                  r"    const prefs = loadPrefs\(\);\n"
                  r"    if \(!prefs\) \{\n"
                  r"      setActiveSources\(\[\]\);\n"
                  r"      setSetupPrefs\(null\);\n"
                  r"      setSetupOpen\(true\);\n"
                  r"    \} else \{\n"
                  r"      applyPrefs\(prefs\);\n"
                  r"      void loadFeed\(false, prefs\.sources\);\n"
                  r"    \}\n"
                  r"  \}, \[applyPrefs, loadFeed\]\);"
              )
              replacement = (
                  "  useEffect(() => {\n"
                  "    if (didInitialize.current) return;\n"
                  "    didInitialize.current = true;\n"
                  "    if (!initialPrefs?.sources.length) return;\n"
                  "    const timer = window.setTimeout(() => {\n"
                  "      void loadFeed(false, initialPrefs.sources);\n"
                  "    }, 0);\n"
                  "    return () => window.clearTimeout(timer);\n"
                  "  }, [initialPrefs, loadFeed]);"
              )
              app_text, count = pattern.subn(replacement, app_text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected exactly one initialization effect, replaced {count}')

          app.write_text(app_text)
          PY

      - name: Rebuild dependency lock from canonical manifest
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --legacy-peer-deps

      - name: Install synchronized dependencies with strict peer resolution
        run: npm ci

      - name: Normalize canonical formatting
        run: npm run format

      - name: Verify formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Commit validated migration artifacts
        run: |
          if git diff --quiet; then
            echo "Migration artifacts already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- package-lock.json src tests vite.config.ts vitest.config.ts playwright.config.ts eslint.config.js package.json
          git commit -m "chore(stack): apply validated canonical stack migration"
          git push origin HEAD:chore/standardize-stack
