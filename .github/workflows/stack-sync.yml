name: Stack Sync

on:
  push:
    branches:
      - chore/standardize-stack
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stack-sync-ai-news
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: chore/standardize-stack

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Activate Tailwind 4 and normalize initial React state
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('src/style.css')
          css_text = css.read_text()
          tailwind_import = "@import 'tailwindcss';"
          if tailwind_import not in css_text:
              css.write_text(tailwind_import + "\n\n" + css_text)
          elif css_text.count(tailwind_import) != 1:
              raise SystemExit(f'Expected at most one Tailwind import, found {css_text.count(tailwind_import)}')

          app = Path('src/App.tsx')
          app_text = app.read_text()

          old_shell = 'className="app-shell"'
          new_shell = 'className="app-shell min-h-screen"'
          if new_shell not in app_text:
              if app_text.count(old_shell) != 1:
                  raise SystemExit(f'Expected exactly one app shell class, found {app_text.count(old_shell)}')
              app_text = app_text.replace(old_shell, new_shell, 1)

          old_state = '''export default function App() {
            const [articles, setArticles] = useState<Article[]>([]);
            const [activeSources, setActiveSources] = useState<string[]>(SOURCES.map((source) => source.id));
            const [filter, setFilter] = useState('all');
            const [query, setQuery] = useState('');
            const [loading, setLoading] = useState(false);
            const [progress, setProgress] = useState<FeedProgress | null>(null);
            const [error, setError] = useState(false);
            const [setupOpen, setSetupOpen] = useState(false);
            const [setupPrefs, setSetupPrefs] = useState<Preferences | null>(null);
          '''.replace('            ', '  ')

          new_state = '''export default function App() {
            const [initialPrefs] = useState(() => loadPrefs());
            const [articles, setArticles] = useState<Article[]>([]);
            const [activeSources, setActiveSources] = useState<string[]>(() => {
              if (!initialPrefs) return [];
              const validIds = new Set(SOURCES.map((source) => source.id));
              return initialPrefs.sources.filter((source) => validIds.has(source));
            });
            const [filter, setFilter] = useState('all');
            const [query, setQuery] = useState('');
            const [loading, setLoading] = useState(false);
            const [progress, setProgress] = useState<FeedProgress | null>(null);
            const [error, setError] = useState(false);
            const [setupOpen, setSetupOpen] = useState(() => !initialPrefs);
            const [setupPrefs, setSetupPrefs] = useState<Preferences | null>(() => initialPrefs);
          '''.replace('            ', '  ')

          if 'const [initialPrefs] = useState(() => loadPrefs());' not in app_text:
              if app_text.count(old_state) != 1:
                  raise SystemExit(f'Expected exactly one initial state block, found {app_text.count(old_state)}')
              app_text = app_text.replace(old_state, new_state, 1)

          old_effect = '''  useEffect(() => {
            if (didInitialize.current) return;
            didInitialize.current = true;
            const prefs = loadPrefs();
            if (!prefs) {
              setActiveSources([]);
              setSetupPrefs(null);
              setSetupOpen(true);
            } else {
              applyPrefs(prefs);
              void loadFeed(false, prefs.sources);
            }
          }, [applyPrefs, loadFeed]);'''.replace('            ', '  ')

          new_effect = '''  useEffect(() => {
            if (didInitialize.current) return;
            didInitialize.current = true;
            if (initialPrefs?.sources.length) {
              void loadFeed(false, initialPrefs.sources);
            }
          }, [initialPrefs, loadFeed]);'''.replace('            ', '  ')

          if 'if (initialPrefs?.sources.length)' not in app_text:
              if app_text.count(old_effect) != 1:
                  raise SystemExit(f'Expected exactly one initialization effect, found {app_text.count(old_effect)}')
              app_text = app_text.replace(old_effect, new_effect, 1)

          app.write_text(app_text)
          PY

      - name: Rebuild dependency lock from canonical manifest
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --legacy-peer-deps

      - name: Install synchronized dependencies with strict peer resolution
        run: npm ci

      - name: Normalize canonical formatting
        run: npm run format

      - name: Verify formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Commit validated migration artifacts
        run: |
          if git diff --quiet; then
            echo "Migration artifacts already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- package-lock.json src tests vite.config.ts vitest.config.ts playwright.config.ts eslint.config.js package.json
          git commit -m "chore(stack): apply validated canonical stack migration"
          git push origin HEAD:chore/standardize-stack
